<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML - Buổi 5</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <span class="subtitle">BECAUSE WE LOVE COFFEE</span>
            <h2 class="title">About Us</h2>
        </div>

        <div class="post-list">
            <div class="box image-box">
                <img src="./img/image1.png" alt="Coffee Art 1">
            </div>
            <div class="box text-box">
                <span class="subtitle">OUR MISSION</span>
                <h3 class="title">It all began with a modest concept: Create amazing coffee</h3>
            </div>

            <div class="box image-box">
                <img src="./img/image2.png" alt="Making Coffee">
            </div>

            <div class="box text-box">
                <span class="subtitle">HOME DELIVERY</span>
                <h3 class="title">Quality coffee delivered to your door</h3>
            </div>
            <div class="box image-box">
                <img src="./img/image3.png" alt="Coffee on table">
            </div>
            <div class="box text-box">
                <span class="subtitle">TIME TO CHILL</span>
                <h3 class="title">Black Coffee Shaved Ice</h3>
            </div>
        </div>
    </div>
</body>
</html>
