        //Bài 2 : Đoán giá trị Truthy/Falsy
        let a = 0;

        //Bài 3: Phân loại điểm thi
        let score = "0";
        if(typeof score !== "number"){
            console.log(`${score} là điểm không hợp lệ`); 
        }else if(!score){
            console.log('Chưa có điểm');
        }else if(score >= 9 && score <= 10){
            console.log(`${score} là điểm Xuất sắc`);
        }else if(score >= 7 && score < 9){
            console.log(`${score} là điểm Giỏi`);
        }else if(score >= 5 && score < 7){
            console.log(`${score} là điểm Trung bình`);
        }else if(score >= 0 && score < 5){
            console.log(`${score} là điểm Yếu`);
        }

        //Bài 4: FizzBuzz
        for(let i = 1; i <= 50; i++ ){
            if(i % 3 === 0 && i % 5 === 0){

        //Bài 5: Kiểm tra số nguyên tố
        let isPrime = true;
        let n = 1;

        if(n % 1 !== 0 || n <= 1){
            isPrime = false;
        }else{
            for(let i = 2; i < n; i++){
                if(n % i === 0){
                    isPrime = false;
                    break;
                }
            }
        }

        if(isPrime){
            console.log(`${n} là số nguyên tố`);
        }else{
            console.log(`${n} không phải số nguyên tố`);
        }
