<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - MyBlog</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased flex flex-col min-h-screen">
    
    <!-- Navbar -->
    <nav class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <a href="index.html" class="text-xl font-extrabold text-indigo-600 tracking-tight">MyBlog</a>
                </div>
                <div class="flex items-center space-x-6">
                    <a href="index.html" class="text-gray-600 hover:text-indigo-600 font-semibold transition-colors">Trang chủ</a>
                    <a href="login.html" class="text-indigo-600 font-semibold">Đăng nhập</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Login Form -->
    <div class="flex-grow flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
        <div class="max-w-md w-full bg-white p-10 rounded-2xl shadow-xl space-y-8">
            <div class="text-center">
                <div class="w-16 h-16 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center mx-auto mb-4">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"></path></svg>
                </div>
                <h2 class="text-3xl font-extrabold text-gray-900 tracking-tight">Đăng nhập</h2>
                <p class="mt-2 text-sm text-gray-500">
                    Dùng tài khoản demo <span class="font-bold text-gray-800">emilys</span> / <span class="font-bold text-gray-800">emilyspass</span>
                </p>
            </div>
            
            <form id="login-form" class="mt-8 space-y-6">
                <!-- Chỗ hiện lỗi -->
                <div id="error-msg" class="hidden bg-red-50 text-red-600 p-4 rounded-lg text-sm text-center font-medium border border-red-100"></div>
                
                <div class="space-y-4">
                    <div>
                        <label for="username" class="block text-sm font-semibold text-gray-700 mb-1">Tên đăng nhập</label>
                        <input id="username" name="username" type="text" required 
                            class="appearance-none block w-full px-4 py-3 bg-gray-50 border border-gray-200 text-gray-900 rounded-lg focus:outline-none focus:bg-white focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all sm:text-sm" 
                            placeholder="Ví dụ: emilys">
                    </div>
                    <div>
                        <label for="password" class="block text-sm font-semibold text-gray-700 mb-1">Mật khẩu</label>
                        <input id="password" name="password" type="password" required 
                            class="appearance-none block w-full px-4 py-3 bg-gray-50 border border-gray-200 text-gray-900 rounded-lg focus:outline-none focus:bg-white focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all sm:text-sm" 
                            placeholder="••••••••">
                    </div>
                </div>

                <div>
                    <button type="submit" 
                        class="w-full flex justify-center py-3 px-4 border border-transparent text-sm font-bold rounded-lg text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 shadow-sm hover:shadow-md transition-all transform hover:-translate-y-0.5">
                        Đăng nhập
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="login.js"></script>
</body>
</html>
