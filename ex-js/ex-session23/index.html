<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang chủ - MyBlog</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased">
    <!-- Navbar -->
    <nav class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <a href="index.html" class="text-xl font-extrabold text-indigo-600 tracking-tight">MyBlog</a>
                </div>
                <div class="flex items-center space-x-6">
                    <a href="index.html" class="text-indigo-600 font-semibold">Trang chủ</a>
                    <!-- Nút Đăng nhập / Đăng xuất được JS kiểm tra token để hiện/ẩn -->
                    <span id="user-greeting" class="text-gray-500 text-sm hidden sm:block font-medium"></span>
                    <a href="login.html" id="nav-login-btn" class="text-gray-600 hover:text-indigo-600 font-semibold transition-colors">Đăng nhập</a>
                    <button id="nav-logout-btn" class="hidden text-gray-600 hover:text-red-600 font-semibold transition-colors">Đăng xuất</button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
        
        <!-- Form Đăng bài mới -->
        <section class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 mb-10">
            <h2 class="text-lg font-bold mb-4 text-gray-900">Chia sẻ câu chuyện của bạn</h2>
            <form id="add-post-form" class="space-y-4">
                <div>
                    <input type="text" id="post-title" placeholder="Tiêu đề bài viết..." required
                        class="w-full px-4 py-3 bg-gray-50 border border-transparent rounded-lg focus:bg-white focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none transition-all">
                </div>
                <div>
                    <textarea id="post-body" rows="3" placeholder="Nội dung bài viết..." required
                        class="w-full px-4 py-3 bg-gray-50 border border-transparent rounded-lg focus:bg-white focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none transition-all resize-none"></textarea>
                </div>
                <div class="flex justify-end">
                    <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 px-6 rounded-lg shadow-sm transition-all transform hover:-translate-y-0.5">
                        Đăng bài
                    </button>
                </div>
            </form>
        </section>

        <!-- Danh sách bài viết -->
        <section>
            <h2 class="text-2xl font-bold mb-6 text-gray-900">Bài viết mới nhất</h2>
            
            <!-- Grid chứa bài viết -->
            <div id="posts-container" class="grid gap-6 md:grid-cols-2">
                <!-- JS sẽ render HTML vào đây -->
            </div>
            
            <!-- Trạng thái trống (khi mảng rỗng) -->
            <div id="empty-state" class="text-center py-16 text-gray-400 hidden">
                <svg class="mx-auto h-12 w-12 text-gray-300 mb-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9.5L18.5 7H20a2 2 0 012 2v10a2 2 0 01-2 2H19z" />
                </svg>
                <p>Chưa có bài viết nào.</p>
            </div>
            
            <!-- Phân trang -->
            <div id="pagination" class="mt-8 flex justify-center items-center space-x-4 hidden">
                <button id="prev-page" class="px-4 py-2 bg-white border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed font-medium transition-colors">Trang trước</button>
                <span id="page-info" class="text-gray-600 font-medium">Trang 1 / 1</span>
                <button id="next-page" class="px-4 py-2 bg-white border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed font-medium transition-colors">Trang sau</button>
            </div>
        </section>
    </main>

    <!-- Modal Dùng chung cho Xem chi tiết & Sửa (Mặc định ẩn) -->
    <div id="post-modal" class="fixed inset-0 bg-gray-900 bg-opacity-40 backdrop-blur-sm z-50 flex items-center justify-center hidden opacity-0 transition-opacity duration-300">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl mx-4 overflow-hidden transform scale-95 transition-transform duration-300" id="modal-content">
            <!-- Header Modal -->
            <div class="px-6 py-4 border-b border-gray-100 flex justify-between items-center bg-gray-50">
                <h3 id="modal-title" class="text-lg font-bold text-gray-900">Chi tiết bài viết</h3>
                <button id="close-modal" class="text-gray-400 hover:text-gray-700 text-2xl leading-none transition-colors">&times;</button>
            </div>
            
            <!-- Chế độ XEM CHI TIẾT -->
            <div id="modal-view" class="p-6 max-h-[70vh] overflow-y-auto">
                <h4 id="view-title" class="text-2xl font-bold text-gray-900 mb-4"></h4>
                <p id="view-body" class="text-gray-700 whitespace-pre-wrap leading-relaxed text-lg"></p>
                
                <!-- Khu vực bình luận -->
                <div class="mt-10 pt-6 border-t border-gray-100">
                    <h5 class="font-bold text-gray-900 mb-4 flex items-center gap-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
                        Bình luận (<span id="comments-count">0</span>)
                    </h5>
                    <div id="comments-list" class="space-y-4 text-sm text-gray-600">
                        <!-- Render bình luận vào đây -->
                    </div>
                </div>
            </div>

            <!-- Chế độ SỬA BÀI VIẾT (Ẩn mặc định) -->
            <form id="edit-form" class="p-6 hidden space-y-4">
                <input type="hidden" id="edit-id">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Tiêu đề</label>
                    <input type="text" id="edit-title" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Nội dung</label>
                    <textarea id="edit-body" rows="8" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 outline-none resize-none"></textarea>
                </div>
                <div class="flex justify-end space-x-3 pt-4 border-t border-gray-100">
                    <button type="button" id="cancel-edit" class="px-5 py-2 text-gray-600 bg-gray-100 hover:bg-gray-200 rounded-lg font-medium transition-colors">Huỷ</button>
                    <button type="submit" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg font-medium transition-colors">Lưu thay đổi</button>
                </div>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
